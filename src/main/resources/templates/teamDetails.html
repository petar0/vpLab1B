<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Team Details</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 5px;
            margin: 5px 0;
            background-color: #f5f5f5;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<header>
    <h1 th:text="|Team: ${team.name}|"></h1>
</header>
<section>
    <h2 th:text="|City: ${team.city}|"></h2>
    <h2>Players in this team:</h2>
    <ul>
        <li th:each="player : ${team.players}"
            th:text="|${player.firstName} ${player.lastName} (#${player.jerseyNumber}, ${player.position})|"></li>
    </ul>
    <!-- ako listata e prazna, ja prikazuvame ovaa poraka -->
    <p th:if="${#lists.isEmpty(team.players)}">No players yet</p>
    <!-- id-to na timot go isprakjame do doPost vo TeamListServlet -->
    <form th:action="@{/teams}" method="POST">
        <input type="hidden" name="teamId" th:value="${team.id}">
        <button type="submit">Delete team</button>
    </form>
    <p>
        <a th:href="@{/players(teamId=${team.id})}">Add another player</a> |
        <a th:href="@{/teams}">Back to teams</a>
    </p>
</section>
</body>
</html>
